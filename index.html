<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng - 3D Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0a1128;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 14px 18px;
      background: rgba(10, 20, 45, 0.75);
      border: 1px solid rgba(170, 204, 255, 0.3);
      border-radius: 10px;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="hud">Đang tải Đảo Đèn Lồng...</div>

  <script type="module">
    import { createGameApp } from './src/render/scene.js';
    const container = document.getElementById('game-container');
    createGameApp(container);
  </script>
</body>
</html>
